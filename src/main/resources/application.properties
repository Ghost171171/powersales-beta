# --- Server Port ---
server.port=8080

# --- Statische Ressourcen aus 'web' laden ---
spring.web.resources.static-locations=classpath:/META-INF/resources/, classpath:/resources/, classpath:/static/, classpath:/public/

# --- Logging ---
logging.level.root=INFO
logging.level.com.map=DEBUG

# --- SQLite Datenbank (falls genutzt) ---
spring.datasource.url=jdbc:sqlite:db/pois.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:/db/schema.sql
spring.sql.init.data-locations=classpath:/db/data.sql

# --- Server Cookies ---
server.servlet.session.cookie.same-site=lax
# --- erst aktivieren wenn https aktiv ist ---
# server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m
# Mac-Book Address 192.168.178.152
server.address=0.0.0.0
